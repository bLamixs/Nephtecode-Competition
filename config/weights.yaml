# Веса многокритериальной оптимизации (Multi-objective weights)
# Жёсткие ограничения проверяются ДО целевой функции и не участвуют в компромиссе!

optimization_weights:
  quality_margin_weight: 0.40      # Запас качества от границы спецификации (чем дальше от 10 мг/кг, тем безопаснее)
  production_throughput_weight: 0.30 # Выпуск продукции (максимизация расхода сырья)
  energy_cost_proxy_weight: 0.15     # Энергозатраты (минимизация перегрева печей/температур)
  equipment_wear_risk_weight: 0.15   # Минимизация индекса риска для катализатора и оборудования
