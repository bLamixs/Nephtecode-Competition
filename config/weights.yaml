# ==============================================================================
# ФАЙЛ КОНФИГУРАЦИИ: config/weights.yaml
# НАЗНАЧЕНИЕ: Весовые коэффициенты для многокритериальной оптимизации (Optimization Agent)
# 
# МАТЕМАТИЧЕСКАЯ МОДЕЛЬ ЦЕЛЕВОЙ ФУНКЦИИ:
# Target = w_quality * (Запас по сере) + w_throughput * (Выпуск) 
#          - w_energy * (Энергозатраты) - w_wear * (Риск износа)
#
# КЛЮЧЕВОЕ ПРАВИЛО:
# Данная функция ранжирования применяется ИСКЛЮЧИТЕЛЬНО к тем кандидатам,
# которые уже прошли 100% жёстких технологических ограничений (Hard Constraints).
# Жёсткие ограничения НЕ входят в сумму с весами и не могут быть скомпенсированы!
# ==============================================================================

optimization_weights:
  # 1. Запас качества по сере (Quality Margin):
  # Поощряет режимы, где сера держится с безопасным отступом от критических 10 мг/кг (например, 7-8 мг/кг),
  # защищая от случайных флуктуаций качества сырья.
  quality_margin_weight: 0.40

  # 2. Производительность / Выпуск (Production Throughput):
  # Максимизация суммарного расхода сырой нефти и выработки товарного дизельного топлива.
  production_throughput_weight: 0.30

  # 3. Энергетический прокси (Energy Cost Proxy):
  # Штраф за избыточный нагрев печей АВТ и реактора гидроочистки (расход топливного газа).
  energy_cost_proxy_weight: 0.15

  # 4. Риск износа оборудования и старения катализатора (Equipment Wear Risk):
  # Штраф за работу на предельных температурах T23 (>370°C) и высоких перепадах давления P8.
  equipment_wear_risk_weight: 0.15
