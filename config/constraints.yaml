# ==============================================================================
# ФАЙЛ КОНФИГУРАЦИИ: config/constraints.yaml
# НАЗНАЧЕНИЕ: Жёсткие технологические ограничения (Hard Constraints) и пороги данных
# 
# БИЗНЕС-ПРИНЦИП ХАКАТОНА «НЕФТЕКОД»:
# Качество и технологическая безопасность имеют АБСОЛЮТНЫЙ приоритет над выпуском
# и экономикой. Недопустимый режим нельзя «компенсировать» высокой производительностью.
# Любой кандидат от Агента Оптимизации, нарушающий параметры из этого файла,
# немедленно блокируется правилом VETO в Оркестраторе.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Жёсткие требования спецификации качества товарного ДТ (ГОСТ Р 52368 / Евро-5)
# ------------------------------------------------------------------------------
quality_hard_limits:
  # Массовая доля серы в товарном топливе: ключевое экологическое ограничение Евро-5.
  # При превышении > 10.0 мг/кг партия признаётся некондиционной.
  sulfur_max_mg_kg: 10.0

  # Плотность при 15 °C (кг/м3): определяет массу впрыскиваемого топлива и полноту сгорания
  d15_min_kg_m3: 820.0
  d15_max_kg_m3: 845.0

  # Температура вспышки в закрытом тигле: требования пожарной безопасности при транспортировке
  flash_point_min_c: 55.0

  # Предельная температура фильтруемости (CFPP / ПТФ): забиваемость топливных фильтров парафинами
  cfpp_max_c: -5.0

# ------------------------------------------------------------------------------
# 2. Физические ограничения процесса смешения (блендинг дизельных фракций)
# ------------------------------------------------------------------------------
blending_constraints:
  # Суммарная доля компонентов при смешении должна строго равняться 100%
  total_share_percent: 100.0
  # Допустимая погрешность округления при расчётах
  tolerance_percent: 0.1

# ------------------------------------------------------------------------------
# 3. Контроль достоверности и актуальности данных (Data Freshness & Integrity)
# ------------------------------------------------------------------------------
data_freshness_limits:
  # Поточные анализаторы качества (ПАК): если сигнал отсутствует или заморожен > 60 мин,
  # прибор помечается как вышедший из строя.
  pak_max_age_min: 60.0

  # Лабораторные анализы (ЛИМС): являются контрольным эталоном качества, но проводятся редко.
  # Если возраст анализа превышает 48 часов, он считается устаревшим (Stale Data),
  # и система переходит в режим повышенной осторожности или отказа от рискованного управления.
  lims_max_age_hours: 48.0

  # Время динамического запаздывания отклика качества продукта на гидроочистке
  # (изменение температуры реактора отразится на сере в накопителе только через 30-120 мин)
  response_lag_min: 30
  response_lag_max: 120

# ------------------------------------------------------------------------------
# 4. Пределы технологической надёжности оборудования и катализатора
# ------------------------------------------------------------------------------
equipment_safety_limits:
  # Минимальная загрузка сырой нефти на блок АВТ (F7 + F8 + F9). Ниже 50 т/ч — режим простоя/ремонта.
  avt_total_feed_min: 50.0

  # Максимально допустимая температура в слое катализатора гидроочистки (предотвращение закоксовывания)
  max_reactor_temperature_c: 380.0

  # Максимальное рабочее давление в реакторном контуре установки 24-2000 (предел по прочности аппарата)
  max_reactor_pressure_mpa: 4.5
