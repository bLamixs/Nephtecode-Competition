# ==============================================================================
# ФАЙЛ КОНФИГУРАЦИИ: config/tags.yaml
# НАЗНАЧЕНИЕ: Справочник тегов КИП, управляемых параметров (MV) и целевых показателей
# 
# ТЕХНОЛОГИЧЕСКИЙ ПРИНЦИП:
# Физический смысл параметров извлекается из технологических карт и КИП-справочников,
# а не по первой букве имени тега. Вектор управляемых воздействий ограничен только
# реально управляемыми клапанами, уставками регуляторов температур и расходов.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Кандидатные управляемые параметры (Manipulated Variables - MV)
# ------------------------------------------------------------------------------
manipulated_variables:
  # --- Секция АВТ: расходы сырой обессоленной нефти по параллельным веткам ---
  F7:
    description: "Расход обессоленной нефти в атмосферную трубчатую печь (поток 1)"
    unit: "т/ч"
    default_range: [80.0, 160.0]  # Консервативный рабочий диапазон регулирования
  F8:
    description: "Расход обессоленной нефти в атмосферную трубчатую печь (поток 2)"
    unit: "т/ч"
    default_range: [80.0, 160.0]
  F9:
    description: "Расход обессоленной нефти в атмосферную трубчатую печь (поток 3)"
    unit: "т/ч"
    default_range: [80.0, 160.0]

  # --- Секция гидроочистки 24-2000: температура, давление, водород ---
  T11:
    description: "Температура газосырьевой смеси на входе в реактор гидроочистки Р-201"
    unit: "°C"
    default_range: [320.0, 375.0]  # Регулирует скорость реакции обессеривания
  T23:
    description: "Температура в зоне гидрообессеривания реактора Р-202"
    unit: "°C"
    default_range: [330.0, 380.0]  # Критический параметр для деградации катализатора
  F26:
    description: "Подача дизельного сырья в реакторный блок гидроочистки"
    unit: "т/ч"
    default_range: [150.0, 260.0]  # Объёмная скорость подачи сырья (WHSV)
  P8:
    description: "Перепад давления на слое катализатора реактора Р-202"
    unit: "МПа"
    default_range: [0.10, 0.26]
  P24:
    description: "Давление циркулирующего водородсодержащего газа (ВСГ)"
    unit: "МПа"
    default_range: [0.55, 0.63]   # Определяет парциальное давление водорода

  # --- Секция блендинга: дозирование дизельных компонентов в товарный поток ---
  F30:
    description: "Доля лёгкого компонента дизельного топлива (фракция 240-350°C)"
    unit: "%"
    default_range: [10.0, 50.0]
  F32:
    description: "Доля тяжёлого компонента (фракция атмосферного газойля)"
    unit: "%"
    default_range: [10.0, 50.0]
  F34:
    description: "Доля компонента вторичного происхождения (керосин/присадочный пул)"
    unit: "%"
    default_range: [5.0, 30.0]

# ------------------------------------------------------------------------------
# 2. Выходные показатели качества товарного продукта
# ------------------------------------------------------------------------------
quality_indicators:
  sulfur:
    description: "Массовая доля серы (главный экологический параметр)"
    unit: "мг/кг (ppm)"
    target_max: 10.0               # Требование ГОСТ Р 52368-2005 / EN 590
  d15:
    description: "Плотность при 15°C (влияет на цетановое число и расход топлива)"
    unit: "кг/м3"
    target_range: [820.0, 845.0]
  t50:
    description: "Температура отгона 50% объема (характеризует испаряемость смеси)"
    unit: "°C"
  t90:
    description: "Температура отгона 90% объема"
    unit: "°C"
  t95:
    description: "Температура отгона 95% объема (не более 360°C по стандарту)"
    unit: "°C"
    target_max: 360.0
  cfpp:
    description: "Предельная температура фильтруемости (холодный старт двигателя)"
    unit: "°C"
    target_max: -5.0
